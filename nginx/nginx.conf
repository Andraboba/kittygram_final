server {
  listen 80;
  index index.html;
  server_tokens off;

  # Максимальный размер загружаемых файлов (фото котиков).
  client_max_body_size 20M;

  # Запросы к API передаются в контейнер backend.
  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }

  # Запросы к админке передаются в контейнер backend.
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

  # Файлы, загруженные пользователями.
  location /media/ {
    alias /media/;
  }

  # Статика фронтенда и бэкенда (общий volume static).
  location / {
    alias /static/;
    try_files $uri $uri/ /index.html;
  }
}
